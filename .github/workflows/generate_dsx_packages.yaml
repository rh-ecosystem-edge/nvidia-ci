name: Update DSX AI Factory packages

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      gh_pages_branch:
        description: 'GitHub pages branch to update'
        default: 'gh-pages'
        required: false
        type: string

permissions:
  contents: write
  packages: read
  issues: write

jobs:
  update-packages:
    if: github.event_name != 'schedule' || github.repository == 'rh-ecosystem-edge/nvidia-ci'
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: output
    steps:
      - name: Set dynamic env vars
        run: |
          echo "GH_PAGES_BRANCH=${{ github.event.inputs.gh_pages_branch || 'gh-pages' }}" >> "$GITHUB_ENV"

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Checkout GitHub Pages
        uses: actions/checkout@v6
        with:
          ref: ${{ env.GH_PAGES_BRANCH }}
          path: ${{ env.OUTPUT_DIR }}

      - name: Fetch DSX AI Factory packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api orgs/rh-ecosystem-edge/packages?package_type=container --paginate \
            --jq '.[] | select(.repository.name == "dsx-ai-factory") | {name, html_url, updated_at, visibility}' \
            | jq -s '{packages: (sort_by(.name)), updated: (now | todate)}' \
            > "$OUTPUT_DIR/dsx_packages.json"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ env.GH_PAGES_BRANCH }}
          folder: ${{ env.OUTPUT_DIR }}
          clean: false
          force: false

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
