name: Check for new versions

on:
  schedule:
    - cron: '0 2 * * 1-4'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check out'
        default: 'main'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update-versions:
    uses: ./.github/workflows/update-versions.reusable.yaml
    with:
      branch: ${{ inputs.branch || 'main' }}
      version-file: .github/scripts/gpu_operator_versions/versions.json
      settings-file: .github/scripts/gpu_operator_versions/settings.json
      tests-file: .github/scripts/generated-files/tests_to_trigger.txt
      test-command-suffix: ''
      check-catalog-availability: true
      verification-label: 'gpu-operator-verification:standard'
    secrets: inherit
