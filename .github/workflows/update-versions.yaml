name: Check for new versions
on:
  schedule:
    - cron: '0 0 * * 0-5'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check out'
        default: 'main'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ocp-version:
    if: github.event_name != 'schedule' || github.repository == 'rh-ecosystem-edge/nvidia-ci' || vars.VERSION_UPDATE_FLOW_ENABLE_SCHEDULED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Update versions
        id: update_versions
        run: |
          pip install -r .github/scripts/gpu_operator_versions/requirements.txt
          mkdir -p .github/scripts/generated-files
          PYTHONPATH=.github/scripts python -m gpu_operator_versions.update_versions

          TEST_TRIGGERS=$(cat .github/scripts/generated-files/tests_to_trigger.txt)
          TEST_COMMENTS=$(cat .github/scripts/generated-files/test_comments.txt)
          {
            echo 'TEST_TRIGGERS<<EOF'
            echo "${TEST_TRIGGERS}"
            echo 'EOF'
            echo 'TEST_COMMENTS<<EOF'
            echo "${TEST_COMMENTS}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Expose new GPU operator channels
        id: new_gpu_channels
        run: |
          new_gpu=$(paste -sd, .github/scripts/generated-files/new_gpu_channels.txt)

          if [ -z "${new_gpu}" ]; then
            echo "No new GPU operator channels detected."
            echo "channels=" >> "$GITHUB_OUTPUT"
          else
            echo "New GPU operator channels detected:"
            echo "${new_gpu}"
            echo "channels=${new_gpu}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          title: "[Automatic] Update versions, run ID: ${{ github.run_id }}"
          commit-message: Update versions
          branch: update-versions/${{ github.run_id }}
          body: |
            :warning: Before approving the PR, run the following tests:

            ```
            ${{ steps.update_versions.outputs.TEST_TRIGGERS }}
            /ok-to-test
            /approve
            ```

            ${{ steps.update_versions.outputs.TEST_COMMENTS }}
            /approve

            Update the NVIDIA GPU operator on OpenShift test matrix
            ---
            ${{ vars.VERSION_UPDATE_FLOW_NOTIFY_USERS }}
          delete-branch: true
          assignees: ${{ vars.VERSION_UPDATE_FLOW_ASSIGNEES }}

      - name: Comment test commands on PR
        id: comment-tests
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.MAINTAINER_PERSONAL_ACCESS_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          TEST_TRIGGERS: ${{ steps.update_versions.outputs.TEST_TRIGGERS }}
        run: |
          if [ -z "${TEST_TRIGGERS//[[:space:]]/}" ]; then
            echo "No test triggers to comment; skipping."
            exit 0
          fi

          gh pr comment "${PR_NUMBER}" --body "${TEST_TRIGGERS}"

      - name: Create issues for new GPU operator channels
        if: steps.new_gpu_channels.outputs.channels != ''
        uses: actions/github-script@v8
        env:
          NEW_CHANNELS: ${{ steps.new_gpu_channels.outputs.channels }}
        with:
          script: |
            const channels = process.env.NEW_CHANNELS.split(',');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'operator-available'
            });

            for (const channel of channels) {
              const issueTitle = `New GPU operator channel available: v${channel}`;
              const existingIssue = issues.find(issue => issue.title === issueTitle);

              if (!existingIssue) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueTitle,
                  body: `A new GPU operator channel **v${channel}** has been detected.\n\n## Tasks\n\n- [ ] Ensure Prow jobs exist for this channel\n- [ ] Confirm the channel appears in the relevant version file after the PR is merged\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  labels: ['operator-available']
                });
                console.log(`Created issue for channel v${channel}`);
              } else {
                console.log(`Issue already exists for channel v${channel}: #${existingIssue.number}`);
              }
            }

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          help-file: .github/workflows/update-versions-help.md
