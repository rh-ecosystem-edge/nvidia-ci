name: Create test commands (Reusable)

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to check out'
        required: false
        default: 'main'
        type: string
      version-file:
        description: 'Version matrix file to update'
        required: true
        type: string
      settings-file:
        description: 'Settings file for the version matrix'
        required: true
        type: string
      tests-file:
        description: 'File where generated test commands are written'
        required: true
        type: string
      test-command-suffix:
        description: 'Suffix appended to generated test command job names'
        required: false
        default: ''
        type: string
      check-catalog-availability:
        description: 'Catalog availability flag (passed through to Settings)'
        required: false
        default: true
        type: boolean
    outputs:
      test-triggers:
        description: 'Generated test commands'
        value: ${{ jobs.create-test-commands.outputs.test_triggers }}
      new-gpu-channels:
        description: 'Comma-separated list of newly detected GPU operator channels'
        value: ${{ jobs.create-test-commands.outputs.new_gpu_channels }}

jobs:
  create-test-commands:
    runs-on: ubuntu-latest
    outputs:
      test_triggers: ${{ steps.read_tests.outputs.TEST_TRIGGERS }}
      new_gpu_channels: ${{ steps.new_gpu_channels.outputs.channels }}
    steps:
      - name: Check out the Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install dependencies
        run: pip install -r .github/scripts/gpu_operator_versions/requirements.txt
      - name: Download version state
        uses: actions/download-artifact@v4
        with:
          name: version-state
      - name: Create test commands and update versions
        id: read_tests
        run: |
          mkdir -p "$(dirname "${TEST_TO_TRIGGER_FILE_PATH}")"
          PYTHONPATH=.github/scripts python -m gpu_operator_versions.create_test_commands
          {
           echo 'TEST_TRIGGERS<<EOF'
           cat "${TEST_TO_TRIGGER_FILE_PATH}"
           echo 'EOF'
          } >> $GITHUB_OUTPUT
        env:
          VERSION_FILE_PATH: ${{ inputs.version-file }}
          SETTINGS_FILE_PATH: ${{ inputs.settings-file }}
          TEST_TO_TRIGGER_FILE_PATH: ${{ inputs.tests-file }}
          TEST_COMMAND_SUFFIX: ${{ inputs.test-command-suffix }}
          CHECK_CATALOG_AVAILABILITY: ${{ inputs.check-catalog-availability }}
          VERSION_STATE_PATH: version_state.json
      - name: Detect new GPU operator channels
        id: new_gpu_channels
        env:
          VERSIONS_FILE: ${{ inputs.version-file }}
        run: |
          old_channels=$(git show HEAD:"${VERSIONS_FILE}" | jq -r '."gpu-operator" | keys[]')
          new_channels=$(jq -r '."gpu-operator" | keys[]' "${VERSIONS_FILE}")
          new_gpu=$(comm -23 <(echo "${new_channels}") <(echo "${old_channels}"))

          if [ -z "${new_gpu}" ]; then
            echo "No new GPU operator channels detected."
            echo "channels=" >> "$GITHUB_OUTPUT"
          else
            echo "New GPU operator channels detected:"
            echo "${new_gpu}"
            echo "channels=$(echo "${new_gpu}" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload version updates
        uses: actions/upload-artifact@v4
        with:
          name: version-updates
          path: |
            ${{ inputs.version-file }}
            ${{ inputs.tests-file }}
          retention-days: 1
