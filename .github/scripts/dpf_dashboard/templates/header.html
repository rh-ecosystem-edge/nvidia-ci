<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Matrix: Red Hat OpenShift DPF</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-main {
            background-color: #e0f2f1;
            color: #00695c;
            border: 1px solid #80cbc4;
        }
        .badge-release {
            background-color: #e8eaf6;
            color: #283593;
            border: 1px solid #9fa8da;
        }
        .image-cell {
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            max-width: 350px;
        }
        .image-tag {
            color: #009688;
            font-weight: bold;
        }
        td.status-success {
            background-color: #e8f5e9;
        }
        td.status-failure {
            background-color: #ffebee;
        }
        .run-date {
            font-size: 12px;
            color: #888;
            display: block;
        }
    </style>
    <script>
    function sortTable(table, col) {
        var rows = Array.from(table.querySelectorAll('tbody tr'));
        var asc = table.getAttribute('data-sort-asc') !== 'true';
        table.setAttribute('data-sort-asc', asc);
        rows.sort(function(a, b) {
            var A = a.cells[col].textContent.trim();
            var B = b.cells[col].textContent.trim();
            return asc ? A.localeCompare(B, undefined, {numeric: true}) : B.localeCompare(A, undefined, {numeric: true});
        });
        var tbody = table.querySelector('tbody');
        rows.forEach(function(row) { tbody.appendChild(row); });
    }
    </script>
</head>
<body>

<h1>Test Matrix: Red Hat OpenShift DPF</h1>
