name: Generate GPU Operator matrix (Reusable)

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch containing dashboard scripts'
        required: false
        default: 'main'
        type: string
      pr-number:
        description: 'PR number to process, or all'
        required: true
        type: string
      gh-pages-branch:
        description: 'GitHub Pages branch to update'
        required: false
        default: 'gh-pages'
        type: string
      verification-label:
        description: 'GPU Operator verification label represented by this dashboard'
        required: true
        type: string
      data-filename:
        description: 'Dashboard JSON filename'
        required: true
        type: string
      html-filename:
        description: 'Dashboard HTML filename'
        required: true
        type: string
      job-suffix:
        description: 'Prow job suffix used by this verification variant'
        required: false
        default: ''
        type: string
      dashboard-title:
        description: 'Dashboard title'
        required: true
        type: string
      sibling-url:
        description: 'URL of the sibling dashboard'
        required: true
        type: string
      sibling-label:
        description: 'Label for the sibling dashboard link'
        required: true
        type: string
      force-generate:
        description: 'Generate HTML even when dashboard JSON is unchanged'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  generate-matrix:
    if: >-
      github.event_name != 'pull_request_target' ||
      (
        github.repository == 'rh-ecosystem-edge/nvidia-ci' &&
        contains(
          toJSON(github.event.pull_request.labels.*.name),
          format('"{0}"', inputs.verification-label)
        )
      )
    runs-on: ubuntu-latest
    env:
      DASHBOARD_OUTPUT_DIR: '.github/scripts/test_matrix_dashboard/output'
      DASHBOARD_DEPLOY_DIR: '.github/scripts/test_matrix_dashboard/deploy'
      DASHBOARD_DATA_FILEPATH: '.github/scripts/test_matrix_dashboard/output/${{ inputs.data-filename }}'
      DASHBOARD_HTML_FILEPATH: '.github/scripts/test_matrix_dashboard/output/${{ inputs.html-filename }}'
    steps:
      - name: Check out dashboard code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r .github/scripts/gpu_operator_dashboard/requirements.txt

      - name: Acquire dashboard publication lock
        id: publication-lock
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAGES_BRANCH: ${{ inputs.gh-pages-branch }}
        run: |
          set -euo pipefail

          lock_branch="dashboard-publication-lock/${GH_PAGES_BRANCH}"
          lock_ref="refs/heads/${lock_branch}"
          lock_tree="$(git mktree </dev/null)"
          lock_commit="$(
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit-tree "$lock_tree" \
                  -m "Dashboard publication lock for ${GH_PAGES_BRANCH}" \
                  -m "run-id: ${GITHUB_RUN_ID}" \
                  -m "run-attempt: ${GITHUB_RUN_ATTEMPT}" \
                  -m "nonce: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          )"

          for attempt in $(seq 1 360); do
            if git push origin "$lock_commit:$lock_ref" >/dev/null 2>&1; then
              echo "Acquired ${lock_ref} for run ${GITHUB_RUN_ID}"
              echo "acquired=true" >> "$GITHUB_OUTPUT"
              echo "lock-sha=${lock_commit}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! current_sha="$(git ls-remote origin "$lock_ref" | cut -f1)"; then
              echo "Unable to inspect ${lock_ref}; retrying" >&2
              sleep 30
              continue
            fi
            if [[ -z "$current_sha" ]]; then
              echo "Publication lock became available; retrying creation"
              sleep 1
              continue
            fi

            if ! lock_message="$(gh api \
                  "repos/${GITHUB_REPOSITORY}/git/commits/${current_sha}" \
                  --jq .message 2>/dev/null)"; then
              echo "Unable to inspect lock owner commit; retrying" >&2
              sleep 30
              continue
            fi

            owner_run_id="$(printf '%s\n' "$lock_message" | sed -n 's/^run-id: //p')"
            owner_run_attempt="$(printf '%s\n' "$lock_message" | sed -n 's/^run-attempt: //p')"
            if [[ ! "$owner_run_id" =~ ^[0-9]+$ ]] ||
               [[ ! "$owner_run_attempt" =~ ^[0-9]+$ ]]; then
              echo "${lock_ref} has no valid owning run attempt; refusing unsafe recovery" >&2
              exit 1
            fi

            if ! run_status="$(gh run view "$owner_run_id" \
                  --attempt "$owner_run_attempt" \
                  --repo "$GITHUB_REPOSITORY" \
                  --json status \
                  --jq .status 2>/dev/null)"; then
              echo "Unable to inspect owning run attempt ${owner_run_id}/${owner_run_attempt}; retrying" >&2
              sleep 30
              continue
            fi

            if [[ "$run_status" != "completed" ]]; then
              echo "Publication lock is owned by active run attempt ${owner_run_id}/${owner_run_attempt}"
              sleep 30
              continue
            fi

            echo "Recovering stale lock from completed run attempt ${owner_run_id}/${owner_run_attempt}"
            if git push origin \
                 --force-with-lease="$lock_ref:$current_sha" \
                 "$lock_commit:$lock_ref" >/dev/null 2>&1; then
              echo "Acquired recovered ${lock_ref} for run ${GITHUB_RUN_ID}"
              echo "acquired=true" >> "$GITHUB_OUTPUT"
              echo "lock-sha=${lock_commit}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "Timed out waiting for ${lock_ref}" >&2
          exit 1

      - name: Check out GitHub Pages
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.gh-pages-branch }}
          path: ${{ env.DASHBOARD_OUTPUT_DIR }}

      - name: Fetch verification results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Processing ${{ inputs.verification-label }} results for PR: ${{ inputs.pr-number }}"
          PYTHONPATH=.github/scripts python -m gpu_operator_dashboard.fetch_ci_data \
            --pr_number "${{ inputs.pr-number }}" \
            --baseline_data_filepath "${{ env.DASHBOARD_DATA_FILEPATH }}" \
            --merged_data_filepath "${{ env.DASHBOARD_DATA_FILEPATH }}" \
            --job-suffix="${{ inputs.job-suffix }}"

      - name: Generate dashboard
        id: generate-dashboard
        run: |
          cd "${{ env.DASHBOARD_OUTPUT_DIR }}"
          if [[ "${{ inputs.force-generate }}" != "true" ]] &&
             git ls-files --error-unmatch "${{ inputs.data-filename }}" >/dev/null 2>&1 &&
             git diff --exit-code "${{ inputs.data-filename }}"; then
            echo "No changes for ${{ inputs.verification-label }}"
            echo "rendered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cd "${{ github.workspace }}"
          echo "Generating ${{ inputs.verification-label }} dashboard..."
          PYTHONPATH=.github/scripts python -m gpu_operator_dashboard.generate_ci_dashboard \
            --dashboard_data_filepath "${{ env.DASHBOARD_DATA_FILEPATH }}" \
            --dashboard_html_filepath "${{ env.DASHBOARD_HTML_FILEPATH }}" \
            --title "${{ inputs.dashboard-title }}" \
            --sibling-url "${{ inputs.sibling-url }}" \
            --sibling-label "${{ inputs.sibling-label }}"
          echo "rendered=true" >> "$GITHUB_OUTPUT"

      - name: Stage variant-owned dashboard files
        if: steps.generate-dashboard.outputs.rendered == 'true'
        run: |
          mkdir -p "$DASHBOARD_DEPLOY_DIR"
          cp "$DASHBOARD_DATA_FILEPATH" "$DASHBOARD_DEPLOY_DIR/"
          cp "$DASHBOARD_HTML_FILEPATH" "$DASHBOARD_DEPLOY_DIR/"

      - name: Deploy HTML to GitHub Pages
        if: steps.generate-dashboard.outputs.rendered == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ inputs.gh-pages-branch }}
          folder: ${{ env.DASHBOARD_DEPLOY_DIR }}
          clean: false
          force: false

      - name: Release dashboard publication lock
        if: always() && steps.publication-lock.outputs.acquired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAGES_BRANCH: ${{ inputs.gh-pages-branch }}
          LOCK_SHA: ${{ steps.publication-lock.outputs.lock-sha }}
        run: |
          set -euo pipefail

          lock_branch="dashboard-publication-lock/${GH_PAGES_BRANCH}"
          lock_ref="refs/heads/${lock_branch}"

          for attempt in $(seq 1 10); do
            if ! current_sha="$(git ls-remote origin "$lock_ref" | cut -f1)"; then
              echo "Unable to inspect ${lock_ref}; retrying release" >&2
              sleep 5
              continue
            fi

            if [[ -z "$current_sha" ]]; then
              echo "Publication lock is already released"
              exit 0
            fi

            if [[ "$current_sha" != "$LOCK_SHA" ]]; then
              echo "${lock_ref} is no longer owned by this run; refusing deletion" >&2
              exit 1
            fi

            if git push origin \
                 --force-with-lease="$lock_ref:$LOCK_SHA" \
                 ":$lock_ref" >/dev/null 2>&1; then
              echo "Released ${lock_ref}"
              exit 0
            fi

            echo "Unable to release ${lock_ref} (attempt ${attempt}/10); retrying"
            sleep 5
          done

          echo "Timed out releasing ${lock_ref}" >&2
          exit 1

      - name: Delete merged branch
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.user.login == 'github-actions[bot]'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Deleting merged branch: $BRANCH"
          git push origin --delete "$BRANCH" || echo "Branch $BRANCH already deleted or doesn't exist"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
