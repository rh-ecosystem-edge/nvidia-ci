name: Generate NNO and DOCA2 pair matrices

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      periodic_job:
        description: 'Periodic Prow job to poll once its NNO pair artifact is available'
        required: false
        default: 'periodic-ci-rh-ecosystem-edge-nvidia-ci-main-doca2-deploy-cluster'
        type: string
      publish:
        description: 'Commit the generated reports to gh-pages'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PREVIEW_ROOT: ${{ runner.temp }}/nno-report-preview
    steps:
      - name: Check out report code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install report dependencies
        run: python3 -m pip install -r .github/scripts/gpu_operator_dashboard/requirements.txt

      - name: Test collection and rendering
        run: PYTHONPATH=.github/scripts python3 -m unittest nno_pair_report.test_report

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test Prow manifest writer
        run: go test -mod=vendor ./internal/nnopairreport ./cmd/nno-pair-report

      - name: Render synthetic preview
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 - <<'PY'
          import os
          from pathlib import Path
          from nno_pair_report.test_report import write_sample_manifests

          write_sample_manifests(Path(os.environ["PREVIEW_ROOT"]) / "input")
          PY
          PYTHONPATH=.github/scripts python3 -m nno_pair_report.collect \
            --input-dir "$PREVIEW_ROOT/input" \
            --output "$PREVIEW_ROOT/history.json"
          python3 .github/scripts/nno_pair_report/render.py \
            --data "$PREVIEW_ROOT/history.json" \
            --output-dir "$PREVIEW_ROOT/report" \
            --label 'Synthetic PR preview'
          cp "$PREVIEW_ROOT/history.json" "$PREVIEW_ROOT/report/nno_doca2_history.json"

      - name: Upload synthetic report preview
        uses: actions/upload-artifact@v4
        with:
          name: nno-report-synthetic-preview
          path: ${{ env.PREVIEW_ROOT }}/report/
          retention-days: 7

  report:
    if: >-
      github.repository == 'rh-ecosystem-edge/nvidia-ci' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      has_data: ${{ steps.report_data.outputs.has_data }}
    env:
      PERIODIC_JOB: ${{ inputs.periodic_job || 'periodic-ci-rh-ecosystem-edge-nvidia-ci-main-doca2-deploy-cluster' }}
      REPORT_HISTORY: ${{ runner.temp }}/nno-pair-report/history.json
      REPORT_OUTPUT: nno-pair-report-output
    steps:
      - name: Check out report code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out published report history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: nno-pages-baseline
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install artifact client dependencies
        run: python3 -m pip install -r .github/scripts/gpu_operator_dashboard/requirements.txt

      - name: Collect NNO pair manifests
        env:
          PROW_TOKEN: ${{ secrets.PROW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--output "$REPORT_HISTORY" --periodic-job "$PERIODIC_JOB")
          if [[ -f nno-pages-baseline/nno_doca2_history.json ]]; then
            args+=(--baseline nno-pages-baseline/nno_doca2_history.json)
          fi
          PYTHONPATH=.github/scripts python3 -m nno_pair_report.collect "${args[@]}"

      - name: Check whether report data exists
        id: report_data
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          history = json.loads(Path(os.environ["REPORT_HISTORY"]).read_text())
          has_data = bool(history["builds"])
          print("has_data=" + ("true" if has_data else "false"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              if has_data:
                  summary.write(f"NNO report contains {len(history['builds'])} Prow builds.\n")
              else:
                  summary.write("No NNO pair manifest found; no report to preview or publish.\n")
          PY

      - name: Render and stage report pages
        if: steps.report_data.outputs.has_data == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/nno_pair_report/render.py \
            --data "$REPORT_HISTORY" \
            --output-dir "$RUNNER_TEMP/nno-pair-report/rendered" \
            --label 'Prow job history'
          mkdir -p "$REPORT_OUTPUT"
          cp "$REPORT_HISTORY" "$REPORT_OUTPUT/nno_doca2_history.json"
          cp "$RUNNER_TEMP/nno-pair-report/rendered/nno_doca2_matrix.json" "$REPORT_OUTPUT/"
          cp "$RUNNER_TEMP/nno-pair-report/rendered/nno_doca2_matrix.html" "$REPORT_OUTPUT/"
          cp "$RUNNER_TEMP/nno-pair-report/rendered/nno_doca2_explorer.html" "$REPORT_OUTPUT/"
          cp "$RUNNER_TEMP/nno-pair-report/rendered/nno_doca2_signed_matrix.json" "$REPORT_OUTPUT/"
          cp "$RUNNER_TEMP/nno-pair-report/rendered/nno_doca2_signed_matrix.html" "$REPORT_OUTPUT/"
          cp "$RUNNER_TEMP/nno-pair-report/rendered/nno_doca2_signed_explorer.html" "$REPORT_OUTPUT/"

      - name: Upload report preview
        if: steps.report_data.outputs.has_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nno-report-live-preview
          path: ${{ env.REPORT_OUTPUT }}/
          retention-days: 7

  publish:
    needs: report
    if: >-
      needs.report.outputs.has_data == 'true' &&
      (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download generated reports
        uses: actions/download-artifact@v4
        with:
          name: nno-report-live-preview
          path: nno-pair-report-output

      - name: Publish NNO reports to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: nno-pair-report-output
          clean: false
          force: false
